name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**", "docs/**"]
  pull_request:
    branches: ["main"]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned, not `stable`: a new stable release adds clippy lints, and
      # `-D warnings` then fails CI for code nobody touched (1.99 did this via
      # `double_must_use` in async-trait's expansion). Bump deliberately —
      # the procedure is in docs/SUPPLY_CHAIN.md.
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # `--locked`: CI builds exactly what Cargo.lock says, and fails if the
      # lockfile is stale instead of silently resolving something newer.
      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log

      # Name the failing tests in check annotations, so a red run can be
      # diagnosed from the checks API.
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          if [ -f test.log ]; then
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' test.log \
              | grep -E '^test .* \.\.\. FAILED$|panicked at ' | head -9 \
              | while IFS= read -r line; do echo "::error::${line}"; done || true
          fi

      - name: cargo clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log

      # Surface lint failures as check annotations, so they are readable from
      # the checks API without downloading the job log.
      - name: Annotate clippy failures
        if: failure()
        shell: bash
        run: |
          echo "::notice::$(rustc --version)"
          if [ -f clippy.log ]; then
            sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' clippy.log \
              | grep -E '(error|warning)(\[[A-Za-z0-9_:]+\])?:' \
              | grep -v 'could not compile' | head -9 \
              | while IFS= read -r line; do echo "::error::${line}"; done || true
          fi

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Advisories (the RustSec database `cargo audit` reads), licences,
      # banned/wildcard dependencies and crate sources. Configured in deny.toml.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
